<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Entrega de EPI</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f5f7fb;
}

main{
padding:40px;
}

.container{
max-width:1000px;
margin:auto;
}

.titulo{
font-size:34px;
margin-bottom:30px;
color:#333;
}

.form-card{
background:#fff;
padding:35px;
border-radius:18px;
box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.campo{
display:flex;
flex-direction:column;
margin-bottom:20px;
}

label{
margin-bottom:8px;
font-weight:600;
}

input,
select,
textarea{
padding:14px;
border:1px solid #ddd;
border-radius:10px;
}

textarea{
height:120px;
resize:none;
}

.acoes{
display:flex;
justify-content:flex-end;
gap:15px;
margin-top:25px;
}

.btn-cancelar{
background:#ececec;
border:none;
padding:14px 25px;
border-radius:10px;
cursor:pointer;
}

.acoes button:nth-child(1){
background:#cfe1ff;
color:#3f4a5c;
}

.acoes button:nth-child(2){
background:#fde7b3;
color:#6b4f1b;
}

.acoes button:nth-child(3){
background:#d8f5e6;
color:#2f5a45;
}

.acoes button:nth-child(4){
background:#f8d7da;
color:#7a2d35;
}

.btn-salvar{
background:#8b7cf6;
color:white;
border:none;
padding:14px 25px;
border-radius:10px;
font-weight:bold;
cursor:pointer;
}
header{
    height:85px;
    background:#fff;
    border-bottom:1px solid #e5e5e5;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 40px;
}

.usuario{
    display:flex;
    align-items:center;
    gap:15px;
}

.usuario img{
    width:55px;
    height:55px;
    border-radius:50%;
}
.menu-item{
    background:#ece8ff;
    color:#6b46ff;
    padding:10px 18px;
    border-radius:10px;
    font-weight:bold;
}

.btn-sair{
    background:#fff1f1;
    color:#d9534f;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
}

</style>
</head>
<body>
<header>

<div class="usuario">

<img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

<div class="info">
<small>Painel Admin</small>
<h3>Administrador</h3>
</div>

</div>

<div class="menu-item">
<i class="fa-solid fa-clipboard-check"></i>
Entrega de EPI
</div>

<button class="btn-sair">
<i class="fa-solid fa-right-from-bracket"></i>
Sair
</button>

</header>

    

<main>

<div class="container">

<h1 class="titulo">

Entrega de EPI
</h1>

<form class="form-card">

<div class="grid">

<div class="campo">
<label>Funcionário</label>
<select>
<option>João da Silva</option>
<option>Maria Santos</option>
</select>
</div>

<div class="campo">
<label>Setor</label>
<select>
<option>Produção</option>
<option>Manutenção</option>
</select>
</div>

<div class="campo">
<label>EPI</label>
<select>
<option>Capacete</option>
<option>Luvas</option>
<option>Óculos</option>
</select>
</div>

<div class="campo">
<label>Quantidade</label>
<input type="number">
</div>

<div class="campo">
<label>Data da Entrega</label>
<input type="date">
</div>

<div class="campo">
<label>Data Prevista de Troca</label>
<input type="date">
</div>

<div class="campo">
<label>Responsável</label>
<input type="text">
</div>

</div>

<div class="campo">
<label>Observações</label>
<textarea></textarea>
</div>

<div class="acoes">
<button type="button" class="btn-cancelar">Limpar</button>
<button type="button" class="btn-cancelar">Alterar</button>
<button type="button" class="btn-cancelar">Consultar</button>
<button type="button" class="btn-cancelar">Excluir</button>
<button type="submit" class="btn-salvar">Registrar Entrega</button>
</div>

</form>

</div>

</main>

<script src="logout.js"></script>
</body>
</html>
