<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastrar EPI</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f5f7fb;
}

header{
height:85px;
background:#fff;
border-bottom:1px solid #e5e5e5;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 40px;
}

.usuario{
display:flex;
align-items:center;
gap:15px;
}

.usuario img{
width:55px;
height:55px;
border-radius:50%;
}

.info small{
display:block;
color:#777;
}

.info h3{
color:#333;
}

.menu-item{
background:#ece8ff;
color:#6b46ff;
padding:10px 18px;
border-radius:10px;
font-weight:bold;
}

.btn-sair{
background:#fff1f1;
color:#d9534f;
border:none;
padding:12px 20px;
border-radius:10px;
cursor:pointer;
}

main{
padding:40px;
}

.container{
max-width:1100px;
margin:auto;
}

.titulo{
font-size:34px;
margin-bottom:30px;
color:#333;
}

.form-card{
background:white;
padding:35px;
border-radius:18px;
box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.secao{
margin-bottom:35px;
}

.secao h2{
margin-bottom:20px;
font-size:22px;
color:#333;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.campo{
display:flex;
flex-direction:column;
}

.campo label{
margin-bottom:8px;
font-weight:600;
color:#555;
}

.campo input,
.campo select,
.campo textarea{
padding:14px;
border:1px solid #ddd;
border-radius:10px;
outline:none;
}

.campo textarea{
height:120px;
resize:none;
}

.campo input:focus,
.campo select:focus,
.campo textarea:focus{
border-color:#6b46ff;
}

.acoes{
display:flex;
justify-content:flex-end;
gap:15px;
margin-top:30px;
}

.btn-cancelar{
padding:14px 25px;
border:none;
background:#ececec;
border-radius:10px;
cursor:pointer;
}

.btn-salvar{
padding:14px 25px;
border:none;
background:#6b46ff;
color:white;
font-weight:bold;
border-radius:10px;
cursor:pointer;
}

@media(max-width:900px){

.grid{
grid-template-columns:1fr;
}

header{
flex-direction:column;
height:auto;
padding:20px;
gap:20px;
}

}

</style>
</head>
<body>

<header>

<div class="usuario">

<img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

<div class="info">
<small>Painel Admin</small>
<h3>Administrador</h3>
</div>

</div>

<div class="menu-item">
<i class="fa-solid fa-helmet-safety"></i>
Cadastrar EPI
</div>

<button class="btn-sair">
<i class="fa-solid fa-right-from-bracket"></i>
Sair
</button>

</header>

<main>

<div class="container">

<h1 class="titulo">Cadastrar EPI</h1>

<form class="form-card">

<div class="secao">

<h2>Dados do EPI</h2>

<div class="grid">

<div class="campo">
<label>Nome do EPI</label>
<input type="text" placeholder="Ex: Capacete de Segurança">
</div>

<div class="campo">
<label>Categoria</label>
<select>
<option>Capacete</option>
<option>Luvas</option>
<option>Óculos</option>
<option>Botas</option>
<option>Protetor Auricular</option>
<option>Máscara</option>
</select>
</div>

<div class="campo">
<label>Certificado de Aprovação (CA)</label>
<input type="text">
</div>

<div class="campo">
<label>Fabricante</label>
<input type="text">
</div>

</div>

</div>

<div class="secao">

<h2>Controle de Estoque</h2>

<div class="grid">

<div class="campo">
<label>Quantidade Inicial</label>
<input type="number">
</div>

<div class="campo">
<label>Estoque Mínimo</label>
<input type="number">
</div>

<div class="campo">
<label>Data da Compra</label>
<input type="date">
</div>

<div class="campo">
<label>Validade</label>
<input type="date">
</div>

</div>

</div>

<div class="secao">

<h2>Informações Extras</h2>

<div class="grid">

<div class="campo">
<label>Vídeo Tutorial</label>
<input type="url" placeholder="Link do vídeo">
</div>

<div class="campo">
<label>Descrição</label>
<textarea placeholder="Descrição do EPI"></textarea>
</div>

</div>

</div>

<div class="acoes">

<button type="button" class="btn-cancelar">
Cancelar
</button>

<button type="submit" class="btn-salvar">
Cadastrar EPI
</button>

</div>

</form>

</div>

</main>

</body>
</html>
