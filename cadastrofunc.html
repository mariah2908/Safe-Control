<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastrar Funcionário</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f5f7fb;
}

header{
    height:85px;
    background:#fff;
    border-bottom:1px solid #e5e5e5;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 40px;
}

.usuario{
    display:flex;
    align-items:center;
    gap:15px;
}

.usuario img{
    width:55px;
    height:55px;
    border-radius:50%;
}

.info small{
    color:#777;
    display:block;
}

.menu{
    display:flex;
    gap:15px;
}

.menu-item{
    padding:10px 18px;
    border-radius:10px;
    background:#ece8ff;
    color:#6b46ff;
    font-weight:bold;
}

.btn-sair{
    border:none;
    background:#fff1f1;
    color:#d9534f;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
}

main{
    padding:40px;
}

.container{
    max-width:1000px;
    margin:auto;
}

.titulo{
    font-size:34px;
    margin-bottom:30px;
    color:#333;
}

.form-card{
    background:#fff;
    padding:35px;
    border-radius:18px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.secao{
    margin-bottom:35px;
}

.secao h2{
    font-size:20px;
    margin-bottom:20px;
    color:#333;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.campo{
    display:flex;
    flex-direction:column;
}

.campo label{
    margin-bottom:8px;
    color:#555;
    font-weight:600;
}

.campo input,
.campo select{
    padding:14px;
    border:1px solid #dcdcdc;
    border-radius:10px;
    outline:none;
}

.campo input:focus,
.campo select:focus{
    border-color:#6b46ff;
}

.acoes{
    display:flex;
    justify-content:flex-end;
    gap:15px;
    margin-top:30px;
}

.btn-cancelar{
    background:#f1f1f1;
    border:none;
    padding:14px 25px;
    border-radius:10px;
    cursor:pointer;
}

.btn-salvar{
    background:#6b46ff;
    color:white;
    border:none;
    padding:14px 25px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

@media(max-width:900px){

    .grid{
        grid-template-columns:1fr;
    }

    header{
        flex-direction:column;
        height:auto;
        gap:20px;
        padding:20px;
    }

}

</style>
</head>
<body>

<header>

<div class="usuario">

<img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

<div class="info">
<small>Painel Admin</small>
<h3>Administrador</h3>
</div>

</div>

<div class="menu">
<div class="menu-item">
<i class="fa-solid fa-user-plus"></i>
Cadastrar Funcionário
</div>
</div>

<button class="btn-sair">
<i class="fa-solid fa-right-from-bracket"></i>
Sair
</button>

</header>

<main>

<div class="container">

<h1 class="titulo">Cadastrar Funcionário</h1>

<form action="salvar-funcionario.php" method="post" class="form-card">

<div class="secao">

<h2>Dados Pessoais</h2>

<div class="grid">

<div class="campo">
<label>Nome Completo</label>
<input type="text" name="nome">
</div>

<div class="campo">
<label>CPF</label>
<input type="text" name="cpf">
</div>

<div class="campo">
<label>Matrícula</label>
<input type="text" name="matricula">
</div>

<div class="campo">
<label>E-mail</label>
<input type="email" name="email">
</div>

<div class="campo">
<label>Telefone</label>
<input type="text" name="telefone">
</div>

</div>

</div>

<div class="secao">

<h2>Dados Profissionais</h2>

<div class="grid">

<div class="campo">
<label>Cargo</label>
<input type="text" name="cargo">
</div>

<div class="campo">
<label>Setor</label>

<label></label>
<input type="text" name="setor_id">

</div>

<div class="campo">
<label>Data de Admissão</label>
<input type="date" name="data_admissao">
</div>

</div>

</div>

<div class="secao">

<h2>Acesso ao Sistema</h2>

<div class="grid">

<div class="campo">
<label>Usuário</label>
<input type="text" name="usuario">
</div>

<div class="campo">
<label>Senha</label>
<input type="password" name="senha">
</div>

</div>

</div>

<div class="acoes">

<button type="button" class="btn-cancelar">
Cancelar
</button>

<button type="submit" class="btn-salvar">
Cadastrar Funcionário
</button>

</div>

</form>

</div>

</main>

<script src="logout.js"></script>
</body>
</html>
