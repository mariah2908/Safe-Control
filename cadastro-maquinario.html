<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastrar Maquinário</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f5f7fb;
}

header{
    height:85px;
    background:#fff;
    border-bottom:1px solid #e5e5e5;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 40px;
}

.usuario{
    display:flex;
    align-items:center;
    gap:15px;
}

.usuario img{
    width:55px;
    height:55px;
    border-radius:50%;
}

.info small{
    display:block;
    color:#777;
}

.info h3{
    color:#333;
}

.menu-item{
    background:#ece8ff;
    color:#6b46ff;
    padding:10px 18px;
    border-radius:10px;
    font-weight:bold;
}

.btn-sair{
    background:#fff1f1;
    color:#d9534f;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
}

main{
    padding:40px;
}

.container{
    max-width:1000px;
    margin:auto;
}

.titulo{
    font-size:34px;
    margin-bottom:30px;
    color:#333;
}

.form-card{
    background:white;
    padding:35px;
    border-radius:18px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.secao{
    margin-bottom:35px;
}

.secao h2{
    margin-bottom:20px;
    color:#333;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.campo{
    display:flex;
    flex-direction:column;
}

.campo label{
    margin-bottom:8px;
    font-weight:600;
    color:#555;
}

.campo input,
.campo select,
.campo textarea{
    padding:14px;
    border:1px solid #ddd;
    border-radius:10px;
    outline:none;
}

.campo textarea{
    resize:none;
    height:120px;
}

.campo input:focus,
.campo select:focus,
.campo textarea:focus{
    border-color:#6b46ff;
}

.acoes{
    display:flex;
    justify-content:flex-end;
    gap:15px;
    margin-top:30px;
}

.btn-cancelar{
    background:#ececec;
    border:none;
    padding:14px 25px;
    border-radius:10px;
    cursor:pointer;
}

.btn-salvar{
    background:#6b46ff;
    color:white;
    border:none;
    padding:14px 25px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

@media(max-width:900px){

    .grid{
        grid-template-columns:1fr;
    }

    header{
        flex-direction:column;
        height:auto;
        gap:20px;
        padding:20px;
    }

}

</style>
</head>
<body>

<header>

<div class="usuario">

<img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

<div class="info">
<small>Painel Admin</small>
<h3>Administrador</h3>
</div>

</div>

<div class="menu-item">
<i class="fa-solid fa-industry"></i>
Cadastrar Maquinário
</div>

<button class="btn-sair">
<i class="fa-solid fa-right-from-bracket"></i>
Sair
</button>

</header>

<main>

<div class="container">

<h1 class="titulo">Cadastrar Maquinário</h1>

<form class="form-card">

<div class="secao">

<h2>Dados do Maquinário</h2>

<div class="grid">

<div class="campo">
<label>Nome do Maquinário</label>
<input type="text" name="nome_maquinario" placeholder="Ex: Prensa Hidráulica X200">
</div>

<div class="campo">
<label>Setor</label>
<select name="setor">
<option>Produção</option>
<option>Manutenção</option>
<option>Logística</option>
<option>Administrativo</option>
</select>
</div>

<div class="campo">
<label>Marca / Fabricante</label>
<input type="text" name="marca" placeholder="Ex: Marca XYZ">
</div>

<div class="campo">
<label>Modelo</label>
<input type="text" name="modelo" placeholder="Ex: X200">
</div>

<div class="campo">
<label>Número de Série</label>
<input type="text" name="numero_serie" placeholder="Ex: SN123456789">
</div>

<div class="campo">
<label>Ano de Fabricação</label>
<input type="number" name="ano_fabricacao" min="1900" max="2100" placeholder="Ex: 2018">
</div>

<div class="campo">
<label>Data de Aquisição</label>
<input type="date" name="data_aquisicao">
</div>

</div>

</div>

<div class="secao">

<h2>Informações Complementares</h2>

<div class="campo">
<label>Descrição / Observações</label>
<textarea name="descricao" placeholder="Observações, histórico de manutenção..."></textarea>
</div>

</div>

<div class="acoes">

<button type="button" class="btn-cancelar">
Cancelar
</button>

<button type="submit" class="btn-salvar">
Cadastrar Maquinário
</button>

</div>

</form>

</div>

</main>

</body>
</html>
